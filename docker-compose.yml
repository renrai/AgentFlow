name: agentflow

services:
  api:
    build:
      context: .
      dockerfile: src/AgentFlow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-only-signing-key-change-before-production-32chars}
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=agentflow;Username=agentflow;Password=agentflow
      ConnectionStrings__Redis: redis:6379
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: agentflow
      RabbitMq__Password: agentflow
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: src/AgentFlow.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=agentflow;Username=agentflow;Password=agentflow
      ConnectionStrings__Redis: redis:6379
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: agentflow
      RabbitMq__Password: agentflow
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
      AiProviders__Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      AiProviders__OpenAi__ApiKey: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agentflow
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: agentflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow -d agentflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: agentflow
      RABBITMQ_DEFAULT_PASS: agentflow
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol-contrib/otel-collector.yaml"]
    volumes:
      - ./deploy/otel/otel-collector.yaml:/etc/otelcol-contrib/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
